<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" aria-labelledby="zohoVisTitle" role="img">
  <title id="zohoVisTitle">Zoho Ecosystem Visualization</title>
  <!-- Central node -->
  <circle cx="250" cy="250" r="40" fill="#0A1F44" />
  <text x="250" y="255" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">ZOHO</text>
  <!-- Surrounding product nodes -->
  <g class="zoho-node" transform="rotate(0 250 250)">
    <circle cx="250" cy="120" r="30" fill="#F56565" />
    <text x="250" y="125" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12">CRM</text>
  </g>
  <g class="zoho-node" transform="rotate(45 250 250)">
    <circle cx="250" cy="120" r="30" fill="#48BB78" />
    <text x="250" y="125" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12">BOOKS</text>
  </g>
  <g class="zoho-node" transform="rotate(90 250 250)">
    <circle cx="250" cy="120" r="30" fill="#ECC94B" />
    <text x="250" y="125" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12">CREATOR</text>
  </g>
  <g class="zoho-node" transform="rotate(135 250 250)">
    <circle cx="250" cy="120" r="30" fill="#9F7AEA" />
    <text x="250" y="125" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12">ANALYTICS</text>
  </g>
  <g class="zoho-node" transform="rotate(180 250 250)">
    <circle cx="250" cy="120" r="30" fill="#38B2AC" />
    <text x="250" y="125" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12">DESK</text>
  </g>
  <!-- Add more nodes as needed -->
  <!-- Connecting lines -->
  <line x1="250" y1="250" x2="250" y2="120" stroke="#0066FF" stroke-width="2" opacity="0.6" />
  <line x1="250" y1="250" x2="250" y2="120" transform="rotate(45 250 250)" stroke="#0066FF" stroke-width="2" opacity="0.6" />
  <line x1="250" y1="250" x2="250" y2="120" transform="rotate(90 250 250)" stroke="#0066FF" stroke-width="2" opacity="0.6" />
  <line x1="250" y1="250" x2="250" y2="120" transform="rotate(135 250 250)" stroke="#0066FF" stroke-width="2" opacity="0.6" />
  <line x1="250" y1="250" x2="250" y2="120" transform="rotate(180 250 250)" stroke="#0066FF" stroke-width="2" opacity="0.6" />
</svg>
