<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zovance Tech – Fast-Paced Human Social Reel (4K Ultra-HD 2160x3840)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700;800;900&family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #030712;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            max-width: 100%;
        }
        .canvas-container {
            position: relative;
            box-shadow: 0 25px 80px -15px rgba(0, 102, 255, 0.4), 0 0 120px rgba(16, 185, 129, 0.15);
            border-radius: 36px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.12);
            background: #020617;
            max-height: 86vh;
            aspect-ratio: 9 / 16;
        }
        canvas {
            display: block;
            width: auto;
            height: 100%;
            max-height: 86vh;
        }
        .status-bar {
            display: flex;
            gap: 20px;
            align-items: center;
            font-size: 14px;
            color: #94a3b8;
            font-family: 'Space Grotesk', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="canvas-container">
            <canvas id="reelCanvas" width="2160" height="3840"></canvas>
        </div>
        <div class="status-bar">
            <span id="status">Loading assets...</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('reelCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const statusEl = document.getElementById('status');

        // AUTHENTIC NON-AI HUMAN ASSETS
        const ASSETS = {
            logoHorizontal: './assets/primary-logo-horizontal-white-text.png',
            symbol: './assets/zovance-symbol.png',
            directorArunmozhi: './assets/director-arunmozhi.jpeg',
            directorPrasannan: './assets/director-prasannan.jpeg',
            directorVasudevan: './assets/director-vasudevan.jpeg',
            humanDeveloper: './assets/human-developer-architect.jpg',
            teamCollaboration: './assets/scene4-transformation-team.jpg',
            corporateHq: './assets/scene6-corporate-hq.jpg',
            zohoOneUi: './assets/zoho-one-ui.png',
            zohoCrm: './assets/zoho-crm.png',
            zohoBooks: './assets/zoho-books.png',
            zohoCreator: './assets/zoho-creator.png',
            zohoAnalytics: './assets/zoho-analytics.png'
        };

        const images = {};
        let loadedCount = 0;
        const totalImages = Object.keys(ASSETS).length;

        // 17 FAST-PACED RHYTHMIC CUTS (TOTAL: 36.0 SECONDS, ~1.9s PER BEAT @ 126 BPM)
        const SCENES = [
            { id: 'cut01_brand_hook', name: 'Brand Hook: Making Work Effortless', duration: 2.0 },
            { id: 'cut02_problem_fluff', name: 'Problem: Tired of AI Fluff', duration: 1.8 },
            { id: 'cut03_human_truth', name: 'Human Architecture: Zero Fluff', duration: 1.9 },
            { id: 'cut04_director_arunmozhi', name: 'Director Arunmozhi: Operations', duration: 1.9 },
            { id: 'cut05_director_prasannan', name: 'Director Prasannan: Cloud Architect', duration: 1.9 },
            { id: 'cut06_director_vasudevan', name: 'Director Vasudevan: Client Success', duration: 1.9 },
            { id: 'cut07_craft_deluge', name: 'Craft: 100% In-House Deluge Code', duration: 1.9 },
            { id: 'cut08_live_pipeline', name: 'Speed: 14ms Cross-Cloud Sync', duration: 1.9 },
            { id: 'cut09_suite_zoho_one', name: 'Zoho One: 40+ Unified Applications', duration: 1.9 },
            { id: 'cut10_app_crm', name: 'Zoho CRM: Predictive Sales Pipeline', duration: 1.9 },
            { id: 'cut11_app_books_creator', name: 'Zoho Books & Creator: E-Invoicing & Apps', duration: 1.9 },
            { id: 'cut12_team_action', name: 'Enterprise Partnership: Dedicated Team', duration: 1.9 },
            { id: 'cut13_stat_speed', name: 'Enterprise Impact: 55% Turnaround', duration: 1.9 },
            { id: 'cut14_stat_roi', name: 'Enterprise Impact: 3.4x 90-Day ROI', duration: 1.9 },
            { id: 'cut15_client_proof', name: 'Verified Enterprise Case Study', duration: 1.9 },
            { id: 'cut16_cta_kickoff', name: 'Ready To Scale Your Enterprise?', duration: 2.0 },
            { id: 'cut17_outro_contact', name: 'Outro: Direct Hotline & Salem HQ', duration: 5.5 }
        ];

        const TOTAL_DURATION = SCENES.reduce((acc, s) => acc + s.duration, 0); // Exactly 36.0s
        const TRANSITION_TIME = 0.15; // Fast energetic snap transition

        async function preloadAssets() {
            statusEl.textContent = 'Loading web fonts...';
            try {
                await document.fonts.ready;
            } catch (e) {
                console.warn('Font loading note:', e);
            }

            return new Promise((resolve) => {
                for (let key in ASSETS) {
                    const img = new Image();
                    img.src = ASSETS[key];
                    img.onload = () => {
                        loadedCount++;
                        images[key] = img;
                        statusEl.textContent = `Loading authentic 4K assets (${loadedCount}/${totalImages})...`;
                        if (loadedCount === totalImages) {
                            statusEl.textContent = '4K Master Engine Ready!';
                            resolve();
                        }
                    };
                    img.onerror = (e) => {
                        console.error('Failed loading asset:', ASSETS[key], e);
                        loadedCount++;
                        if (loadedCount === totalImages) resolve();
                    };
                }
            });
        }

        // =========================================================================
        // EASING & DRAWING HELPERS (4K RESOLUTION COORDINATES: 2160 x 3840)
        // =========================================================================
        function easeInOutCubic(x) {
            return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
        }

        function easeOutCubic(x) {
            return 1 - Math.pow(1 - x, 3);
        }

        function drawRoundedRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        function createZohoGradient(ctx, x1, y1, x2, y2) {
            const g = ctx.createLinearGradient(x1, y1, x2, y2);
            g.addColorStop(0.0, '#ef4444');  // Zoho Red
            g.addColorStop(0.3, '#f59e0b');  // Zoho Yellow
            g.addColorStop(0.65, '#10b981'); // Zoho Green
            g.addColorStop(1.0, '#0066ff');  // Zoho Blue
            return g;
        }

        function draw4KPill(ctx, cx, cy, text, font, textColor, bgColor, borderColor, px = 40, py = 24) {
            ctx.save();
            ctx.font = font;
            const m = ctx.measureText(text);
            const w = m.width + px * 2;
            const h = py * 2;
            const x = cx - w / 2;
            const y = cy - h / 2;

            drawRoundedRect(ctx, x, y, w, h, h / 2);
            if (bgColor) {
                ctx.fillStyle = bgColor;
                ctx.fill();
            }
            if (borderColor) {
                ctx.strokeStyle = borderColor;
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            ctx.fillStyle = textColor;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, cx, cy);
            ctx.restore();
            return { x, y, w, h };
        }

        function drawLeftPill(ctx, x, y, text, font, textColor, bgColor, borderColor, px = 36, py = 20) {
            ctx.save();
            ctx.font = font;
            const m = ctx.measureText(text);
            const w = m.width + px * 2;
            const h = py * 2;

            drawRoundedRect(ctx, x, y, w, h, h / 2);
            if (bgColor) {
                ctx.fillStyle = bgColor;
                ctx.fill();
            }
            if (borderColor) {
                ctx.strokeStyle = borderColor;
                ctx.lineWidth = 2.5;
                ctx.stroke();
            }

            ctx.fillStyle = textColor;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, x + px, y + h / 2);
            ctx.restore();
            return { x, y, w, h };
        }

        function drawCoverImage(ctx, img, x, y, w, h, radius = 0, scale = 1.0, panX = 0, panY = 0) {
            if (!img) return;
            ctx.save();
            if (radius > 0) {
                drawRoundedRect(ctx, x, y, w, h, radius);
                ctx.clip();
            }

            const imgRatio = img.width / img.height;
            const targetRatio = w / h;
            let renderW, renderH;

            if (imgRatio > targetRatio) {
                renderH = h * scale;
                renderW = h * scale * imgRatio;
            } else {
                renderW = w * scale;
                renderH = (w * scale) / imgRatio;
            }

            const offsetX = x + (w - renderW) / 2 + panX;
            const offsetY = y + (h - renderH) / 2 + panY;

            ctx.drawImage(img, offsetX, offsetY, renderW, renderH);
            ctx.restore();
        }

        // =========================================================================
        // BRAND SHOWCASE LOCKUP (MATCHES USER REFERENCE IMAGE • NO WHITE BOX)
        // =========================================================================
        function drawZovanceBrandShowcase(ctx, cy, anim) {
            ctx.save();
            ctx.globalAlpha = anim;

            // Decorative Tech Line Art on Sides (Sun on left, Network nodes on right)
            const leftX = 340;
            const leftY = cy - 40;
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.22)';
            ctx.lineWidth = 5;

            ctx.beginPath();
            ctx.arc(leftX, leftY, 130, 0, Math.PI * 2);
            ctx.stroke();

            for (let a = 0; a < 8; a++) {
                const angle = (a / 8) * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(leftX + Math.cos(angle) * 165, leftY + Math.sin(angle) * 165);
                ctx.lineTo(leftX + Math.cos(angle) * 255, leftY + Math.sin(angle) * 255);
                ctx.stroke();
            }

            const rightX = 1820;
            const rightY = cy - 40;
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.22)';
            ctx.lineWidth = 5;

            ctx.beginPath();
            ctx.arc(rightX, rightY, 55, 0, Math.PI * 2);
            ctx.stroke();

            const nodeOffsets = [
                { dx: 0, dy: -130 },
                { dx: 0, dy: 130 },
                { dx: -130, dy: 0 },
                { dx: 130, dy: 0 }
            ];
            nodeOffsets.forEach(n => {
                ctx.beginPath();
                ctx.moveTo(rightX, rightY);
                ctx.lineTo(rightX + n.dx, rightY + n.dy);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(rightX + n.dx, rightY + n.dy, 45, 0, Math.PI * 2);
                ctx.stroke();
            });

            for (let a = 0; a < 6; a++) {
                const angle = (a / 6) * Math.PI * 2 + Math.PI / 6;
                ctx.beginPath();
                ctx.moveTo(rightX + Math.cos(angle) * 200, rightY + Math.sin(angle) * 200);
                ctx.lineTo(rightX + Math.cos(angle) * 280, rightY + Math.sin(angle) * 280);
                ctx.stroke();
            }

            // Center Logo: Transparent Zovance Horizontal Logo directly on dark canvas (NO white box!)
            const logoImg = images.logoHorizontal;
            if (logoImg) {
                const logoW = 1280;
                const imgRatio = logoImg.width / logoImg.height;
                const logoH = logoW / imgRatio;
                const logoX = (2160 - logoW) / 2;
                const logoY = cy - logoH - 30;
                ctx.drawImage(logoImg, logoX, logoY, logoW, logoH);
            }

            // Headline: "Making Work Effortless"
            ctx.font = '900 96px "Plus Jakarta Sans"';
            const t1 = 'Making Work ';
            const t2 = 'Effortless';
            const w1 = ctx.measureText(t1).width;
            const w2 = ctx.measureText(t2).width;
            const totalW = w1 + w2;
            const startX = 1080 - totalW / 2;

            ctx.textAlign = 'left';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(t1, startX, cy + 90);

            const headGrad = ctx.createLinearGradient(startX + w1, cy + 90, startX + totalW, cy + 90);
            headGrad.addColorStop(0, '#38bdf8');
            headGrad.addColorStop(1, '#818cf8');
            ctx.fillStyle = headGrad;
            ctx.fillText(t2, startX + w1, cy + 90);

            // Subtitle Tagline: "AUTOMATE • SIMPLIFY • GROW"
            ctx.font = '800 36px "Space Grotesk"';
            ctx.fillStyle = '#94a3b8';
            ctx.textAlign = 'center';
            ctx.fillText('AUTOMATE   •   SIMPLIFY   •   GROW', 1080, cy + 185);

            ctx.restore();
        }

        // =========================================================================
        // BROADCAST LOWER-THIRD (CINEMATIC HUMAN PROFILE)
        // =========================================================================
        function drawBroadcastLowerThird(ctx, name, title, roleSubtitle, color = '#38bdf8') {
            const barY = 2850;
            const barH = 500;

            // Deep gradient scrim under lower third for contrast
            const scrim = ctx.createLinearGradient(0, barY - 200, 0, 3840);
            scrim.addColorStop(0, 'transparent');
            scrim.addColorStop(0.4, 'rgba(2, 6, 23, 0.92)');
            scrim.addColorStop(1, '#020617');
            ctx.fillStyle = scrim;
            ctx.fillRect(0, barY - 200, 2160, 3840 - (barY - 200));

            // Accent indicator bar
            ctx.fillStyle = color;
            ctx.fillRect(160, barY + 30, 16, 280);

            // Director Name
            ctx.font = '900 92px "Plus Jakarta Sans"';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'left';
            ctx.fillText(name, 220, barY + 110);

            // Title
            ctx.font = '800 38px "Space Grotesk"';
            ctx.fillStyle = color;
            ctx.fillText(title, 220, barY + 190);

            // Role / Trust subtitle
            ctx.font = '500 32px "Plus Jakarta Sans"';
            ctx.fillStyle = '#94a3b8';
            ctx.fillText(roleSubtitle, 220, barY + 265);

            // Official Executive Consultation Pill
            drawLeftPill(ctx, 220, barY + 330, 'DIRECT 1-ON-1 EXECUTIVE CONSULTATION • SALEM HQ', '700 24px "Space Grotesk"', '#38bdf8', 'rgba(56, 189, 248, 0.1)', 'rgba(56, 189, 248, 0.35)', 24, 14);
        }

        // =========================================================================
        // GLOBAL 4K AMBIENT BACKGROUND & HEADER DOCK
        // =========================================================================
        function drawGlobalBackground(ctx, t, progress) {
            // Deep Luxury Obsidian / Navy Gradient
            const bgGrad = ctx.createRadialGradient(1080, 1600, 200, 1080, 1920, 2400);
            bgGrad.addColorStop(0, '#0a1226');
            bgGrad.addColorStop(0.5, '#050914');
            bgGrad.addColorStop(1, '#02040a');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, 2160, 3840);

            // Floating dynamic tech grid
            ctx.fillStyle = 'rgba(255, 255, 255, 0.035)';
            const gridStep = 120;
            for (let gx = 60; gx < 2160; gx += gridStep) {
                for (let gy = 60; gy < 3840; gy += gridStep) {
                    ctx.beginPath();
                    ctx.arc(gx, gy, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Top Progress Bar
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.fillRect(80, 100, 2000, 10);
            const progGrad = createZohoGradient(ctx, 80, 100, 80 + 2000 * progress, 110);
            ctx.fillStyle = progGrad;
            drawRoundedRect(ctx, 80, 100, 2000 * progress, 10, 5);
            ctx.fill();

            // Top Status Dock
            ctx.save();
            drawRoundedRect(ctx, 80, 140, 2000, 140, 36);
            ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            if (images.symbol) {
                ctx.drawImage(images.symbol, 130, 170, 80, 80);
            }

            ctx.font = '800 36px "Plus Jakarta Sans"';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText('ZOVANCE TECH', 240, 195);

            ctx.font = '600 24px "Space Grotesk"';
            ctx.fillStyle = '#38bdf8';
            ctx.fillText('OFFICIAL ZOHO AUTHORIZED PARTNER', 240, 235);

            // Subtle live status indicator
            ctx.fillStyle = '#10b981';
            ctx.beginPath();
            ctx.arc(1980, 210, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(16, 185, 129, 0.4)';
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.restore();
        }

        // =========================================================================
        // 17 INDIVIDUAL SCENE RENDERERS (SNAPPY, CINEMATIC, FULL-BLEED)
        // =========================================================================

        // 01: BRAND HOOK
        function renderCut01(ctx, t, dur) {
            const p = t / dur;
            const anim = easeOutCubic(Math.min(1, t / 0.7));
            drawZovanceBrandShowcase(ctx, 1600, anim);

            ctx.save();
            ctx.globalAlpha = anim;
            draw4KPill(ctx, 1080, 2050, 'OFFICIAL ZOHO SOLUTION PARTNER', '800 32px "Space Grotesk"', '#38bdf8', 'rgba(56, 189, 248, 0.15)', 'rgba(56, 189, 248, 0.4)', 40, 24);

            ctx.font = '500 42px "Plus Jakarta Sans"';
            ctx.fillStyle = '#94a3b8';
            ctx.textAlign = 'center';
            ctx.fillText('Transforming Enterprises Across India & Global Markets', 1080, 2200);
            ctx.restore();
        }

        // 02: PROBLEM / DISRUPTION
        function renderCut02(ctx, t, dur) {
            const anim = easeOutCubic(Math.min(1, t / 0.5));
            ctx.save();
            ctx.globalAlpha = anim;

            draw4KPill(ctx, 1080, 1100, 'THE ENTERPRISE REALITY', '800 32px "Space Grotesk"', '#ef4444', 'rgba(239, 68, 68, 0.15)', 'rgba(239, 68, 68, 0.4)', 36, 22);

            ctx.font = '900 120px "Plus Jakarta Sans"';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.fillText('TIRED OF', 1080, 1380);
            ctx.fillText('BROKEN WORKFLOWS?', 1080, 1540);

            const g = createZohoGradient(ctx, 300, 1780, 1860, 1780);
            ctx.fillStyle = g;
            ctx.font = '900 108px "Plus Jakarta Sans"';
            ctx.fillText('& GENERIC AI BOTS?', 1080, 1800);

            ctx.font = '500 44px "Plus Jakarta Sans"';
            ctx.fillStyle = '#94a3b8';
            ctx.fillText('Generic templates cannot handle complex enterprise logic.', 1080, 2000);
            ctx.restore();
        }

        // 03: HUMAN TRUTH
        function renderCut03(ctx, t, dur) {
            const p = t / dur;
            const camScale = 1.0 + p * 0.05;

            // Full-bleed developer image with cinematic push
            if (images.humanDeveloper) {
                drawCoverImage(ctx, images.humanDeveloper, 0, 300, 2160, 3540, 0, camScale);
            }

            // Dark gradient scrim over bottom
            const scrim = ctx.createLinearGradient(0, 1800, 0, 3840);
            scrim.addColorStop(0, 'transparent');
            scrim.addColorStop(0.5, 'rgba(2, 6, 23, 0.94)');
            scrim.addColorStop(1, '#020617');
            ctx.fillStyle = scrim;
            ctx.fillRect(0, 1800, 2160, 2040);

            ctx.save();
            draw4KPill(ctx, 1080, 2700, 'REAL HUMAN ENGINEERING', '800 32px "Space Grotesk"', '#10b981', 'rgba(16, 185, 129, 0.2)', 'rgba(16, 185, 129, 0.5)', 36, 22);

            ctx.font = '900 96px "Plus Jakarta Sans"';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.fillText('AUTOMATION IS NOT MAGIC.', 1080, 2880);

            const g = createZohoGradient(ctx, 300, 3020, 1860, 3020);
            ctx.fillStyle = g;
            ctx.fillText('IT IS PRECISION ARCHITECTURE.', 1080, 3020);

            ctx.font = '500 40px "Plus Jakarta Sans"';
            ctx.fillStyle = '#cbd5e1';
            ctx.fillText('Certified senior engineers who design custom data pipelines.', 1080, 3180);
            ctx.restore();
        }

        // 04: DIRECTOR ARUNMOZHI
        function renderCut04(ctx, t, dur) {
            const p = t / dur;
            const camScale = 1.0 + p * 0.04;

            if (images.directorArunmozhi) {
                drawCoverImage(ctx, images.directorArunmozhi, 0, 300, 2160, 3540, 0, camScale, 0, -100);
            }

            drawBroadcastLowerThird(ctx, 'ARUNMOZHI', 'DIRECTOR & OPERATIONS STRATEGY', '10+ Years Enterprise ERP Workflows & Cross-Department Systems', '#38bdf8');
        }

        // 05: DIRECTOR PRASANNAN
        function renderCut05(ctx, t, dur) {
            const p = t / dur;
            const camScale = 1.0 + p * 0.04;

            if (images.directorPrasannan) {
                drawCoverImage(ctx, images.directorPrasannan, 0, 300, 2160, 3540, 0, camScale, 0, -100);
            }

            drawBroadcastLowerThird(ctx, 'PRASANNAN', 'DIRECTOR & CLOUD ARCHITECT', 'Master Deluge Programming, REST APIs, Webhooks & Enterprise Security', '#10b981');
        }

        // 06: DIRECTOR VASUDEVAN
        function renderCut06(ctx, t, dur) {
            const p = t / dur;
            const camScale = 1.0 + p * 0.04;

            if (images.directorVasudevan) {
                drawCoverImage(ctx, images.directorVasudevan, 0, 300, 2160, 3540, 0, camScale, 0, -100);
            }

            drawBroadcastLowerThird(ctx, 'VASUDEVAN', 'DIRECTOR & CLIENT SUCCESS', 'Rapid Adoption, Verified 90-Day ROI Turnaround & Continuous Support', '#f59e0b');
        }

        // 07: CRAFT - REAL DELUGE CODE
        function renderCut07(ctx, t, dur) {
            const p = t / dur;

            draw4KPill(ctx, 1080, 500, 'CUSTOM DELUGE CODE • ZERO BLACK BOXES', '800 30px "Space Grotesk"', '#38bdf8', 'rgba(56, 189, 248, 0.15)', 'rgba(56, 189, 248, 0.4)', 36, 22);

            // Mac-style Code Window
            const winY = 660;
            drawRoundedRect(ctx, 140, winY, 1880, 2300, 48);
            ctx.fillStyle = '#050a17';
            ctx.fill();
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.3)';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Window Header
            ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(220, winY + 80, 18, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.arc(280, winY + 80, 18, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#10b981'; ctx.beginPath(); ctx.arc(340, winY + 80, 18, 0, Math.PI * 2); ctx.fill();

            ctx.font = '700 32px "Space Grotesk"';
            ctx.fillStyle = '#94a3b8';
            ctx.textAlign = 'left';
            ctx.fillText('zovance_enterprise_deluge_hook.dg', 420, winY + 90);

            draw4KPill(ctx, 1820, winY + 80, 'PRODUCTION', '800 22px "Space Grotesk"', '#10b981', 'rgba(16, 185, 129, 0.15)', 'rgba(16, 185, 129, 0.4)', 24, 16);

            // Divider
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';

        // =========================================================================

        let sceneCanvases = [];
        let sceneContexts = [];

        function initSceneCanvases() {
            sceneCanvases = [
                document.createElement('canvas'),
                document.createElement('canvas')

            sceneCanvases[1].width = 2160;

        function renderCutById(targetCtx, cutId, localTime, duration) {
            if (targetCtx !== ctx) {
                targetCtx.clearRect(0, 0, 2160, 3840);
            }
            switch (cutId) {
                case 'cut01_brand_hook': renderCut01(targetCtx, localTime, duration); break;
                case 'cut02_problem_fluff': renderCut02(targetCtx, localTime, duration); break;
                case 'cut03_human_truth': renderCut03(targetCtx, localTime, duration); break;

                case 'cut05_director_prasannan': renderCut05(targetCtx, localTime, duration); break;
                case 'cut06_director_vasudevan': renderCut06(targetCtx, localTime, duration); break;
                case 'cut07_craft_deluge': renderCut07(targetCtx, localTime, duration); break;
                case 'cut08_live_pipeline': renderCut08(targetCtx, localTime, duration); break;
                case 'cut09_suite_zoho_one': renderCut09(targetCtx, localTime, duration); break;
                case 'cut10_app_crm': renderCut10(targetCtx, localTime, duration); break;
                case 'cut11_app_books_creator': renderCut11(targetCtx, localTime, duration); break;
                case 'cut12_team_action': renderCut12(targetCtx, localTime, duration); break;
                case 'cut13_stat_speed': renderCut13(targetCtx, localTime, duration); break;
                case 'cut14_stat_roi': renderCut14(targetCtx, localTime, duration); break;
                case 'cut15_client_proof': renderCut15(targetCtx, localTime, duration); break;
                case 'cut16_cta_kickoff': renderCut16(targetCtx, localTime, duration); break;
                case 'cut17_outro_contact': renderCut17(targetCtx, localTime, duration); break;
            }
        }

        function renderMasterFrame(time) {
            const clampedTime = Math.max(0, Math.min(TOTAL_DURATION, time));
            const progress = clampedTime / TOTAL_DURATION;

            let accumulatedTime = 0;
            let currentSceneIndex = 0;
            let currentLocalTime = 0;

            for (let i = 0; i < SCENES.length; i++) {
                const s = SCENES[i];
                if (clampedTime >= accumulatedTime && clampedTime < accumulatedTime + s.duration) {
                    currentSceneIndex = i;
                    currentLocalTime = clampedTime - accumulatedTime;
                    break;
                }
                accumulatedTime += s.duration;
            }

            if (clampedTime >= TOTAL_DURATION) {
                currentSceneIndex = SCENES.length - 1;
                currentLocalTime = SCENES[currentSceneIndex].duration;
            }

            const currentScene = SCENES[currentSceneIndex];
            const isTransitioning = (currentLocalTime > currentScene.duration - TRANSITION_TIME) && (currentSceneIndex < SCENES.length - 1);

            // Global Ambient Background
            drawGlobalBackground(ctx, clampedTime, progress);

            if (!isTransitioning) {
                renderCutById(ctx, currentScene.id, currentLocalTime, currentScene.duration);
            } else {
                // High-Energy Snap Transition (Flash dissolve + slight zoom punch)
                const nextSceneIndex = currentSceneIndex + 1;
                const nextScene = SCENES[nextSceneIndex];
                const transitionProgress = (currentLocalTime - (currentScene.duration - TRANSITION_TIME)) / TRANSITION_TIME;
                const easedT = easeInOutCubic(transitionProgress);

                renderCutById(sceneContexts[0], currentScene.id, currentLocalTime, currentScene.duration);
                renderCutById(sceneContexts[1], nextScene.id, transitionProgress * 0.3, nextScene.duration);

                ctx.save();
                ctx.globalAlpha = 1 - easedT;
                ctx.drawImage(sceneCanvases[0], 0, -20 * easedT);

                ctx.globalAlpha = easedT;
                ctx.drawImage(sceneCanvases[1], 0, 20 * (1 - easedT));

                // Subtle flash hit on the cut
                const flashAlpha = Math.sin(transitionProgress * Math.PI) * 0.15;
                ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
                ctx.fillRect(0, 0, 2160, 3840);
                ctx.restore();
            }
        }

        // =========================================================================
        // PREVIEW & RECORDING HOOKS
        // =========================================================================
        window.isReady = false;
        window.isPaused = false;
        window.previewStartTime = 0;

        window.getTotalDuration = function() {
            return TOTAL_DURATION;
        };

        window.renderFrameAtTime = function(t) {
            renderMasterFrame(t);
        };

        function animate(timestamp) {
            if (!window.previewStartTime) window.previewStartTime = timestamp;
            if (!window.isPaused) {
                const elapsed = (timestamp - window.previewStartTime) / 1000;
                const loopTime = elapsed % (TOTAL_DURATION + 0.5);
                renderMasterFrame(loopTime);
            }
            requestAnimationFrame(animate);
        }

        async function init() {
            initSceneCanvases();
            await preloadAssets();
            window.isReady = true;
            statusEl.textContent = `Fast-Paced Human Social Reel Active (2160x3840 • 17 Cuts • 36.0s)`;
            requestAnimationFrame(animate);
        }

        init();
